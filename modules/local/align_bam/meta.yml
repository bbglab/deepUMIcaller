name: align_bam
description: |
  Converts an unmapped BAM to FASTQ, aligns it with bwa-mem3, re-zips the
  UMI tags with fgumi and coordinate-sorts the result.
keywords:
  - fgumi
  - bwa-mem3
  - alignment
  - map
  - fastq
  - bam
  - zipperbams
tools:
  - fgumi:
      description: |
        Fulcrum Genomics UMI toolkit: a set of tools for working with
        genomic and high throughput sequencing data, including UMIs.
      homepage: https://github.com/fulcrumgenomics/fgumi
      documentation: https://github.com/fulcrumgenomics/fgumi
      tool_dev_url: https://github.com/fulcrumgenomics/fgumi
      doi: ""
      licence: ["MIT"]
  - bwa-mem3:
      description: |
        bwa-mem3 is a short-read alignment tool that is a faster re-implementation
        of the BWA-MEM algorithm, producing identical alignments.
      homepage: https://github.com/lh3/bwa
      documentation: https://github.com/lh3/bwa
      tool_dev_url: https://github.com/lh3/bwa
      doi: "10.1093/bioinformatics/btaa787"
      licence: ["GPL-3.0-or-later"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - unmapped_bam:
      type: file
      description: The unmapped BAM/SAM/CRAM file.
      pattern: "*.{bam,cram,sam}"
  - index_dir:
      type: directory
      description: Directory containing the bwa-mem3 index files
      pattern: "Directory containing bwa-mem3 index *.{amb,ann,bwt.2bit.64,pac,0123}"
  - ref_fasta:
      type: file
      description: FASTA reference file
      pattern: "*.{fasta,fa,fna}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bam:
      type: file
      description: Coordinate-sorted mapped BAM
      pattern: "*.mapped.bam"
  - bai:
      type: file
      description: Index of the mapped BAM
      pattern: "*.mapped.bam.bai"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@bbglab"
