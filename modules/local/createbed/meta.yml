name: createbed
description: Builds a BED file of sequenced positions from a TSV of positions.
keywords:
  - bed
  - bedtools
  - positions
tools:
  - bedtools:
      description: A powerful toolset for genome arithmetic.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/
      licence: ["GPL-2.0-or-later"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false, collapse:false ]
  - bam:
      type: file
      description: |
        The input SAM or BAM file to be sorted.
      pattern: "*.{bam,sam}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bam:
      type: file
      description: |
        Output SAM or BAM file.
      pattern: "*.{bam,sam}"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@sruthipsuresh"
