name: filtervcf
description: Filters VCF mutations and annotates them in the FILTER field, optionally splitting purine/pyrimidine.
keywords:
  - vcf
  - filter
  - mutations
tools:
  - python:
      description: Python is a programming language used for scripting the filter.
      homepage: https://www.python.org/
      documentation: https://www.python.org/doc/
      licence: ["PSF"]

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false, collapse:false ]
  - bam:
      type: file
      description: |
        The input SAM or BAM file to be sorted.
      pattern: "*.{bam,sam}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - bam:
      type: file
      description: |
        Output SAM or BAM file.
      pattern: "*.{bam,sam}"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@sruthipsuresh"
