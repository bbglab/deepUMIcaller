name: postprocess_mutations
description: |
  Post-process raw VarDict mutation calls: intersect with the target BED,
  recompute depth, apply BED- and N-rich filters, and compute the
  mutations-per-position statistics.
keywords:
  - bedtools
  - samtools
  - vardict
  - mutations
  - filter
  - bed

tools:
  - bedtools:
      description: |
        A powerful toolset for genome arithmetic: intersect, merge, subtract
        and other operations on genomic intervals.
      homepage: https://bedtools.readthedocs.io/
      documentation: https://bedtools.readthedocs.io/
      tool_dev_url: https://github.com/arq5x/bedtools2
      doi: "10.1093/bioinformatics/btq033"
      licence: ["GPL-2.0-or-later"]
  - samtools:
      description: |
        SAMtools is a set of utilities for interacting with and post-processing
        short DNA sequence read alignments in the SAM, BAM and CRAM formats.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
  - vardict:
      description: |
        VarDict is a variant caller for SNVs, MNVs, indels and fusions from
        targeted sequencing data.
      homepage: https://github.com/AstraZeneca-NGS/VarDictJava
      documentation: https://github.com/AstraZeneca-NGS/VarDictJava
      tool_dev_url: https://github.com/AstraZeneca-NGS/VarDictJava
      doi: ""
      licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - vcf:
      type: file
      description: Raw VarDict VCF calls to post-process
      pattern: "*.{vcf,vcf.gz}"
  - bed:
      type: file
      description: BED file with the target regions used for filtering
      pattern: "*.{bed,bed.gz}"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - vcf:
      type: file
      description: Filtered and annotated VCF
      pattern: "*.{vcf,vcf.gz}"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"

authors:
  - "@bbglab"
